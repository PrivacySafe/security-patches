# =============================================================================
# PHP2Shell edge guard for nginx, part 1 of 2: http {} context  (v1)
# CVE-2026-109618 / CVE-2026-109619
#
# If this software is helpful, consider a donation to our 501c3 nonprofit:
# https://privacysafe.foundation
#
# A COMPENSATING CONTROL, NOT A FIX. The only complete fix is a patched PHP
# (8.5.12 / 8.4.27 / 8.3.36 / 8.2.35, or your distribution's backport).
#
# Rejects a multipart/form-data POST unless its path is on your allowlist. The
# confirmed 2026-10-24 chain was four such POSTs to "/" and "/index.php"; a site
# that takes no multipart uploads on a path does not need to accept them there.
# It starts in LOG-ONLY mode: nothing is blocked, and each request that WOULD be
# blocked is written to /var/log/nginx/php2shell-guard.log. Run it that way,
# add every legitimate upload path to the allowlist below, then enforce.
# Limits: an attacker can send multipart to any path you allowlist, so keep the
# list short; a header or encoding change defeats any request filter.
#
# This file only defines variables, so it is safe in http {} (for example as
# /etc/nginx/conf.d/php2shell-guard-http.conf). Part 2,
# nginx-php2shell-guard-server.conf, must be included inside each server {}
# you want guarded (nginx does not inherit access_log into a server that sets
# its own, so a http-level rule would not reach those servers).
#
# Install:
#   cp nginx-php2shell-guard-http.conf /etc/nginx/conf.d/php2shell-guard-http.conf
#   cp nginx-php2shell-guard-server.conf /etc/nginx/snippets/php2shell-guard.conf
#   # inside each server { ... }:   include snippets/php2shell-guard.conf;
#   nginx -t && systemctl reload nginx
# Remove: delete the include lines and both files, then nginx -t and reload.
# =============================================================================

# ---- request body size limit -------------------------------------------------
# See the "request body size limit" section of nginx-php2shell-guard-server.conf.
# A client_max_body_size set in this http {} file is only a default: any server
# or location that sets its own value overrides it, so the limit belongs in each
# server block, not here.

# ---- response header size (nginx's own behaviour; nothing to enable) ----------
# nginx refuses an upstream response header larger than fastcgi_buffer_size
# (proxy_buffer_size for proxy_pass) with a 502 and "upstream sent too big
# header" in its error log. The leak in the confirmed chain was a Set-Cookie
# of 819,200 bytes decoded, about 2 MB on the wire: nginx refuses it at default
# buffer sizes and at 1m, and delivers it only with buffers of several MB
# (tested). Keep the buffers small. Set the pool with the size, because
# fastcgi_buffer_size alone makes nginx refuse to start:
#   fastcgi_buffer_size 16k;
#   fastcgi_buffers 8 16k;

map $request_method $p2s_is_post {
    default 0;
    POST    1;
}

map $content_type $p2s_is_multipart {
    default                      0;
    "~*^multipart/form-data"     1;
}

# Allowlist: regular expressions on the request path (no query string). The
# default matches nothing, so with enforcement on every multipart POST is
# refused. Example for a WordPress site that needs media uploads:
#   "~^/wp-admin/(async-upload|media-new)\.php$"  1;
#   "~^/wp-json/wp/v2/media$"                     1;
map $uri $p2s_path_allowed {
    default                              0;
    "~^/__php2shell_allow_nothing__$"    1;
}

# POST, multipart, and not allowlisted.
map "$p2s_is_post$p2s_is_multipart$p2s_path_allowed" $p2s_would_block {
    default 0;
    "110"   1;
}

# ENFORCEMENT SWITCH. "1 0;" logs only. Change it to "1 1;" to refuse (403).
map $p2s_would_block $p2s_deny {
    default 0;
    1       0;
}

log_format p2s_guard '$time_iso8601 $remote_addr "$request" ct="$content_type" len=$content_length';

