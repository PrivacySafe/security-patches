# =============================================================================
# PHP2Shell edge guard for Apache httpd (mod_php or proxy_fcgi)  (v3)
# CVE-2026-109618 / CVE-2026-109619
#
# If this software is helpful, consider a donation to our 501c3 nonprofit:
# https://privacysafe.foundation
#
# A COMPENSATING CONTROL, NOT A FIX. The only complete fix is a patched PHP
# (8.5.12 / 8.4.27 / 8.3.36 / 8.2.35, or your distribution's backport). These
# two guards narrow what an attacker's request can do on the way in and what
# a leak can do on the way out. Both are optional and independent.
#
# 1. MULTIPART GUARD (request side)
#    The confirmed 2026-10-24 chain was four multipart/form-data POSTs to "/"
#    and "/index.php". A site that does not take multipart uploads on a path
#    does not need to accept them there. This guard rejects a multipart POST
#    unless its path is on your allowlist.
#    It starts in LOG-ONLY mode: nothing is blocked, and each request that
#    WOULD be blocked is written to the error log as "php2shell-guard: ...".
#    Run it that way first, add every legitimate upload path to the allowlist,
#    and only then uncomment "Define P2S_ENFORCE" below.
#    Limits: an attacker can send multipart to any path you allowlist, so keep
#    the list short; a header or encoding change defeats any request filter.
#
# 2. COOKIE GUARD (response side)
#    The disclosure stage of the chain returned a PHPSESSID of 819,200 bytes
#    decoded (about 2 MB URL-encoded, on the wire) in Set-Cookie. A cookie over 4096 bytes cannot be
#    stored by a browser anyway, so this replaces the VALUE of any Set-Cookie
#    longer than that with a short marker. It needs mod_headers, and it only
#    removes the leak from the response: it does not stop the memory read.
#    Cutting the cookie also shrinks the response size an access log records
#    (Apache %O), so the oversized-response lead in php2shell-watch.sh and
#    hunt can no longer see the leak. To keep a signal, the guard writes
#    "php2shell-guard: oversized Set-Cookie value removed" to the error log
#    when it fires; watch and hunt (1.4.0 / 5.2.0) both flag that line. It is
#    logged only when the oversized cookie is the FIRST Set-Cookie of the
#    response. The leak is emitted during PHP's session startup, before any
#    application code runs, so it is normally first. In any other position the
#    cookie is still cut, just not logged.
#
# 3. BODY SIZE LIMIT (optional, commented out at the end of this file)
#    A web server refuses an oversized request body before PHP sees it. See
#    the section at the end for what it did to the chain's stage sizes.
#
# Install (Debian/Ubuntu):
#   cp apache-php2shell-guard.conf /etc/apache2/conf-available/php2shell-guard.conf
#   a2enmod headers log_debug          # log_debug is for the log-only messages
#   a2enconf php2shell-guard
#   apachectl configtest && systemctl reload apache2
# Remove:  a2disconf php2shell-guard && systemctl reload apache2
#
# Virtual hosts: a server-level <If> and Header apply to every virtual host
# unless the host overrides them. Confirm with the test in php/edge/README.md.
# =============================================================================

# Uncomment ONLY after the log-only period and after editing the allowlist.
#Define P2S_ENFORCE

# ---- 1. multipart guard ------------------------------------------------------
# Allowlist: a regular expression on the ORIGINAL request line (THE_REQUEST),
# not on %{REQUEST_URI}. A rewrite such as WordPress's per-directory
# "RewriteRule . /index.php [L]" changes REQUEST_URI to /index.php before this
# test runs, which would refuse an allowlisted upload route. The path must be
# followed by a space or "?", so a longer or look-alike path cannot match
# (fail-closed: /upload.php/extra and encoded forms are refused). The default
# matches nothing, so with enforcement on every multipart POST is refused.
# Example for a WordPress site that needs media uploads:
#   m#^POST (/wp-admin/(async-upload|media-new)\.php|/wp-json/wp/v2/media)( |\?)#
# The log line uses LogMessage's own "expr=" condition, not an <If> section: a
# LogMessage inside <If> is not written for a request that Apache resolves
# through a directory index (a POST to "/"), the path the confirmed chain used,
# so log-only mode would have reported nothing for a request that enforcing
# then refuses. The condition appears twice (log line and <If>); keep the two
# identical when you edit the allowlist.
<IfModule log_debug_module>
    LogMessage "php2shell-guard: multipart POST to a path not on the allowlist" "expr=%{REQUEST_METHOD} == 'POST' && %{HTTP:Content-Type} =~ m#^multipart/form-data#i && %{THE_REQUEST} !~ m#^POST /__php2shell_allow_nothing__( |\?)#"
</IfModule>
<If "%{REQUEST_METHOD} == 'POST' && %{HTTP:Content-Type} =~ m#^multipart/form-data#i && %{THE_REQUEST} !~ m#^POST /__php2shell_allow_nothing__( |\?)#">
    <IfDefine P2S_ENFORCE>
        Require all denied
    </IfDefine>
</If>
<IfModule log_debug_module>
    # LogMessage writes at "info"; raise only that module so the rest of the log
    # keeps its level.
    LogLevel log_debug:info
</IfModule>

# ---- 2. cookie guard ---------------------------------------------------------
# "always" covers error responses too; the plain form covers successful ones.
<IfModule headers_module>
    Header always edit Set-Cookie "^([^=;]+=)[^;]{4096,}" "$1php2shell-oversize-cookie-removed"
    Header edit Set-Cookie "^([^=;]+=)[^;]{4096,}" "$1php2shell-oversize-cookie-removed"
</IfModule>
# Record that the guard fired. hook=log_transaction runs once the response is
# built, so it can see the marker the edit left behind.
<IfModule log_debug_module>
    LogMessage "php2shell-guard: oversized Set-Cookie value removed from a response" hook=log_transaction "expr=%{resp:Set-Cookie} =~ /php2shell-oversize-cookie-removed/"
</IfModule>

# ---- 3. request body size limit (optional, OFF by default) --------------------
# In the phpot report the memory-disclosure stage was a 33,128,677-byte chunked
# body and the first memory-pressure stage 1,060,211 bytes; the other two were
# 279,369 and 451,384 bytes. Apache has no body limit by default. Measured on
# Apache 2.4, LimitRequestBody 1048576 answers 413 to bodies of those two large
# sizes, chunked and fixed-length alike, and 262144 refuses all four. Unlike the
# guards above this CANNOT run log-only: too low a value refuses legitimate
# uploads. Set it low for the site and raise it only where uploads happen (a
# per-path override works, as below). A compensating control, not a fix: an
# attacker can resize a request, and it does nothing for a site that must
# accept large bodies everywhere.
#LimitRequestBody 1048576
#<Location "/wp-admin/async-upload.php">
#    LimitRequestBody 67108864
#</Location>

