# =============================================================================
# PHP2Shell edge guard for nginx, part 2 of 2: include inside server {}  (v1)
# CVE-2026-109618 / CVE-2026-109619
#
# If this software is helpful, consider a donation to our 501c3 nonprofit:
# https://privacysafe.foundation
#
# Needs nginx-php2shell-guard-http.conf in http {} first (it defines the
# variables). Include this inside every server {} to guard:
#     include snippets/php2shell-guard.conf;
# A COMPENSATING CONTROL, NOT A FIX: see part 1.
# =============================================================================

# Log requests the guard would block (a second access_log; yours is untouched).
access_log /var/log/nginx/php2shell-guard.log p2s_guard if=$p2s_would_block;

# Refuse them once part 1's switch is set to enforce.
if ($p2s_deny) {
    return 403;
}

# ---- request body size limit (optional, OFF by default) -----------------------
# nginx refuses a request body over client_max_body_size with a 413, chunked or
# fixed-length. The default is 1m, which refuses the phpot report's two large
# stages (1,060,211 and 33,128,677 bytes); 256k refuses all four. A
# server that raised the limit for uploads (64m is common) lost that. Unlike the
# guard above this CANNOT run log-only: too low a value refuses legitimate
# uploads. Set it low for the server and raise it only where uploads happen.
#
# Uncomment ONLY if this server {} block does not already set the directive: a
# second client_max_body_size in the same block fails "nginx -t". If it does,
# lower that value instead. A value in http {} would not help, because it is
# only a default that any server or location setting its own overrides.
#client_max_body_size 1m;
#
# Raise it only in the location that takes uploads (per-location override
# tested), for example:
#   location = /wp-admin/async-upload.php { client_max_body_size 64m; ... }
#
# A compensating control, not a fix: an attacker can resize a request.

